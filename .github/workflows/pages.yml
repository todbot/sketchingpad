# Publishes web/ (the browser flasher) to GitHub Pages, with the latest
# release's zips copied in.  Release assets send no CORS headers, so the
# page can only fetch zips served from its own origin.
name: pages

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch release zips
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # empty on workflow_dispatch, which then takes the latest
          tag="${{ github.event.release.tag_name }}"
          tag=$(gh release view $tag --json tagName -q .tagName)
          url=$(gh release view "$tag" --json url -q .url)
          mkdir -p web/firmware
          gh release download "$tag" --pattern '*.zip' --dir web/firmware
          cd web/firmware
          ls *.zip | jq -R . | jq -s \
            --arg tag "$tag" --arg url "$url" \
            '{tag: $tag, url: $url, files: .}' > index.json
          cat index.json

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
